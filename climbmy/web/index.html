<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="climbmy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>climbmy</title>
  <link rel="manifest" href="manifest.json">

  <!-- Dynamically load Google Maps JavaScript API using key from .env -->
  <script>
    window._gmapsPromise = (async function() {
      try {
        let response = await fetch('assets/.env');
        if (!response.ok) {
          response = await fetch('.env');
        }
        if (response.ok) {
          const content = await response.text();
          const match = content.match(/^\s*GOOGLE_MAPS_API_KEY\s*=\s*([^\r\n#]+)/m);
          if (match && match[1]) {
            const apiKey = match[1].trim().replace(/^["']|["']$/g, '');
            await new Promise((resolve) => {
              const script = document.createElement('script');
              script.src = `https://maps.googleapis.com/maps/api/js?key=${apiKey}&libraries=places,marker`;
              script.async = true;
              script.defer = true;
              script.onload = () => {
                console.log('Google Maps JavaScript SDK initialized successfully from .env');
                resolve();
              };
              script.onerror = (e) => {
                console.error('Failed to load Google Maps script', e);
                resolve(); // Resolve to avoid hanging app startup
              };
              document.head.appendChild(script);
            });
          } else {
            console.warn('GOOGLE_MAPS_API_KEY not found in .env');
          }
        } else {
          console.warn('Could not fetch .env for Google Maps SDK');
        }
      } catch (err) {
        console.error('Error fetching .env or initializing Google Maps SDK:', err);
      }
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
